version: 2

models:
  - name: dim_customer
    description: One row per customer.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_seller
    description: One row per seller.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: dim_product
    description: One row per product, with English category name resolved.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_geography
    description: One row per zip code, with representative lat/lng/city/state.
    columns:
      - name: zip_code_prefix
        tests:
          - unique
          - not_null

  - name: dim_date
    description: One row per calendar day, spanning the full range of orders.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: fact_orders
    description: >
      One row per order line item. See the model's SQL comment for an
      important caveat about order_total_payment_value being repeated
      across items of the same order -- never SUM it directly.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
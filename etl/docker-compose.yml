x-airflow-common: &airflow-common
  # Official Airflow image. Check hub.docker.com/r/apache/airflow for newer tags.
  image: apache/airflow:2.10.2
  environment: &airflow-common-env
    # LocalExecutor: the scheduler runs tasks itself in local subprocesses.
    # Simpler to reason about than CeleryExecutor (no Redis/worker fleet involved).
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow's own metadata database (separate from your OLTP business database)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Required for the scheduler's HTTP healthcheck (port 8974) to respond
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Lets DAGs pip-install extra packages by listing them in requirements.txt
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./olist_analytics:/opt/airflow/dbt_project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  # Airflow's metadata database: tracks DAGs, task instances, run history, etc.
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # One-off container: initializes the metadata DB schema and creates the admin user.
  # Runs once, then exits (you'll see it as "Exited (0)" in `docker compose ps` - that's expected).
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    depends_on:
      <<: *airflow-common-depends-on

  # The UI at localhost:8080. Only reads/displays state - doesn't execute tasks itself.
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # The brain: reads DAG files, decides what should run and when, executes tasks
  # locally (LocalExecutor), and writes results back to the metadata DB.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_postgres_data: